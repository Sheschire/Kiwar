# Full checks on a GitHub runner. Manual only (Actions tab → CI → Run workflow) to spare the
# Actions minutes: every push is checked locally first (see the kiwar-workflow skill).
name: CI

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Database migrations and row-level security
        run: pnpm test:db
      - run: pnpm build
      - name: Quick balance check (fails nothing, prints the report)
        run: pnpm balance --seeds 30 --hours 24
