# Deploys the `game` edge function to Supabase from GitHub (no local setup needed).
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens)
# and SUPABASE_PROJECT_REF (the xxxx of https://xxxx.supabase.co). Skipped while they are missing.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets are not set: skipping the deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Deploy the game function
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy game --project-ref "$SUPABASE_PROJECT_REF" --use-api
